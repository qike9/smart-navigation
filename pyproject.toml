[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-navigation"
version = "1.0.0"
description = "智能寻路导航系统 —— 八种经典寻路算法的交互式可视化与对比工具"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "qike9" }]
keywords = ["pathfinding", "astar", "dijkstra", "jps", "theta-star", "visualization", "navigation", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
image = ["pillow>=9.0"]

[project.scripts]
smart-navigation = "smartnav.cli:main"

[project.urls]
Documentation = "https://github.com/qike9/smart-navigation/tree/main/docs"
Source = "https://github.com/qike9/smart-navigation"

[tool.setuptools]
packages = ["smartnav", "smartnav.ui"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py38"
# legacy/ 是归档的早期实现，保持原样，不纳入代码检查
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]
ignore = ["F541"]
