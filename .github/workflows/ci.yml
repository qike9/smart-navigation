name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 运行单元测试
        run: python -m pytest tests/ -v

      - name: 语法与未定义名称检查
        run: |
          pip install ruff
          ruff check smartnav tests tools smart_navigation.py

      - name: 算法基准冒烟（无界面）
        run: python tools/benchmark.py --size 31 --repeat 1

  tkinter-smoke:
    name: 界面冒烟测试 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 构造窗口并触发寻路
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from smartnav.ui import MainWindow
          from smartnav.models import Position
          app = MainWindow()
          app.update()
          app.grid_map.set_start(Position(1, 1))
          app.grid_map.set_end(Position(20, 20))
          app.find_path()
          app.update()
          assert app.current_path_result.success
          app.destroy()
          print('UI smoke OK')
          "
